<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background</title>
    <style>
        .area{
            /* background-image:배경에 이미지를 넣는것 항상 width값이 필요, url():이미지 주소 */
            width: 500px;/*영역의 너비*/
            height: 1000px;
            aspect-ratio: 509/339;/*이미지 비율/ 자동 높이 조절*/
            background-image:url("images/dog.jpg");
            background-repeat: no-repeat;/*background-repeat:이미지 반복*/
            /* background-size: 50%;*/ /*이미지의 크기 */
            /* background-size: auto; */
            /* background-size: contain;높이값를 기준으로 자동조절 */
            /* background-size: cover;너비값를기준으로 자동조절 */
            background-color: red;
            /* background-position:영역에서 이미지 위치 */
            /* background-position: top; */
            /* background-position: bottom; */
            /* background-position: right; */
            /* background-position: left; */
            /* background-position: center; */
            /* background-position: right bottom; */
            background-position: 10% 60%;
        }
        .area2{
            width: 25%;
            background-image: url(images/dot.png);
            background-repeat:no-repeat;
            background-size: 100%;
            aspect-ratio:1/1;
        }
    </style>
</head>
<body>
    <div class="area"></div>
    <div class="area2"></div>    
</body>
</html>
