<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 상품</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="item.css">
</head>
<body>
    <!-- item box -->
    <div class="item-box">
        <div class="top">
        <!-- image box -->
        <div class="img-box">
        <img src="./images/gajami.jpg" alt="가자미">
        <img class="hotdeel"src="./images/hotdeel.png" alt="핫딜">
        </div>
        <!-- 담기 버튼 -->
        <button class="cart"><i class="fa-solid fa-cart-shopping"></i>담기</button>
        </div>
        <div class="bottom">
            <!-- 설명 box -->
        <div class="content">
            <!-- 상품명 -->
            <div class="name">
                <p>순살 가자마 스테이크 500g (냉동)</p>
            </div>
            </div>
            <!-- 가격 -->
            <div class="price">
                <span class="discount"><s>12,900원</s></span>
                <p><span class="color"><strong>23%</span><span>9,900원</strong></span></p>
            </div>
            <!-- 댓글 -->
            <p class="com"><i class="fa-solid fa-comment-dots"></i>999+</p>
        </div>
        
        

    </div>
</body>
</html>
